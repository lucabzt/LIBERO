algo: RandER
# fraction of all past task transitions kept in the replay buffer (resampled every task)
buffer_fraction: 0.01
# fixed buffer size instead of buffer_fraction (e.g. 1000 as in the paper's Fig. 2 / Table 3); null: use the fraction
n_memories: null
# replay samples per current-task sample in every training batch (the paper does not state it;
# 1.0 = ER's 1:1 concatenation)
replay_ratio: 1.0
# .npy of indices into the past data (all past tasks concatenated) used as the buffer instead of
# the uniform draw, e.g. a fixed buffer for controlled interventions; null: uniform draw
buffer_indices_file: null
# true: the replay DataLoader draws endless random permutations of the buffer (never restarts,
# always full replay batches); false: cycle() over a RandomSampler (restarts every buffer pass,
# last batch of every pass smaller), as in the runs before 2026-11-05
continuous_replay_loader: false
# true: latent replay (MLR): the buffer holds the frozen obs encoder's features (the U-Net's global
# condition, center crop) and the action chunks instead of raw obs; needs policy.freeze_obs_encoder
latent_replay: false
# only the first pool_n_per_task samples of every past task form the pool the buffer is drawn from
# (LIBERO ER: 1000, with buffer_fraction=1.0 the buffer is ER's buffer); null: all past data
pool_n_per_task: null
# uniform (RandER) | task_stratified (exact per-task quotas proportional to task size, uniform
# within a task) | rainbow (same quotas, evenly spaced ranks of the policy's noise-denoise action
# disagreement within a task; Rainbow Memory with AnchorER's step-2 score) | kmeans (same quotas,
# k-means on the obs latent within a task, equal share per cluster, random within a cluster)
buffer_selection: uniform
# true: no reselection: every task's share (max(1, round(buffer_fraction * task size))) is selected
# once with buffer_selection, from that task's data only, at the start of the next task, and kept
# (saved in <run>/fixed_buffer/task<k>.npy); false: the whole buffer is reselected at every task
fixed_buffer: false
# rainbow disagreement: AnchorER defaults (anchor_er.yaml)
rainbow_noise_level: 20
rainbow_inference_steps: 100
rainbow_disagreement_metric: se3
rainbow_action_scale: [0.05, 0.05, 0.05, 0.5, 0.5, 0.5, 1.0]
selection_batch_size: 128
# kmeans selection: clusters per task (fewer if the task's quota is smaller), latent keys as AnchorER
kmeans_n_clusters: 10
kmeans_n_init: 20
representation_keys: [agentview_rgb, eye_in_hand_rgb, gripper_states, joint_states]
