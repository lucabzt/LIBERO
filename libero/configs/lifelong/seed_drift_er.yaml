# SeedDriftER (algos/seed_drift_er.py): latent replay with seeded drift compensation, no pretraining,
# the obs encoder keeps training. Every past task: seed_fraction of its samples raw (k-means medoids
# of its latents at the end of the task), all others as latents stored at the end of the task.
algo: SeedDriftER
seed_fraction: 0.01
kmeans_n_init: 3
# raw seeds per current-task sample in every batch (through the encoder, with gradient; as RandER 1%)
replay_ratio: 1.0
# stored (compensated) latents per current-task sample in every batch (U-Net only)
latent_replay_ratio: 1.0
# none (stale latents, control) | seed_offset (F_t(s) + F_j(x) - F_j(s)) |
# seed_offset_map (F_t(s) + (F_j(x) - F_j(s)) W_j, W_j ridge map fit on task j's seeds, F_j -> F_t) |
# seed_offset_grad (as seed_offset, F_t(s) from the raw seed replay of the same step, with encoder gradient;
# one random cluster member per replayed seed as offset latent, latent_replay_ratio / refit_every unused)
drift_compensation: seed_offset_map
# kmeans (medoids of the image latents) | temporal (evenly spread over the demos, members = time segment) |
# trajectory (every seed_spacing frames along whole demos, few demos)
seed_selection: kmeans
# temporal seeds: instead of each segment's middle frame, demo k's seed at relative position (k + 0.5) / n_demos of its
# segment, so the seeds cover all phases of the task across the demos
seed_stagger: false
# seed_selection=trajectory: seeds every seed_spacing frames along whole demos (frame 0, spacing, ...), demo after demo
# (evenly spread over the dataset) until the budget is used; samples of uncovered demos are not replayed as latents
seed_spacing: 32
# offset generator per task (drift_compensation=gen_grad): none | cond (offset given seed, proprio, action, dt)
# | joint (offset, action, proprio given seed, dt; nothing stored per sample)
generator: none
gen_width: 1024
gen_pca: 256
gen_train_steps: 6000
gen_sample_steps: 20
# joint generator: low-pass the generated arm actions to the first gen_action_dct_keep DCT coefficients along
# the chunk and snap the gripper to +-1 (0: off); generated chunks are jittery with a blurred gripper
gen_action_dct_keep: 0
# one continual shared generator for all past tasks (SharedOffsetGenerator, generator=cond): per-task PCA
# bases, task embedding as condition, at the end of every task gen_train_steps steps on the new task's
# offsets + self-replay of all earlier tasks, the new task repeated to about gen_new_task_share of the mix
gen_shared: false
gen_new_task_share: 0.5
# gen_pca=0 with gen_shared: no PCA bases, offsets standardized with the first task's statistics (small latents)
# for analysis: at the start of every task save gen_save_samples generated replay samples per past task
# (generated / true offsets, replayed / true current latents) to seed_drift/generated_task<t>.pt (0: off)
gen_save_samples: 0
# *_grad modes: weight of a loss pulling the replayed raw seeds' current latents (no augmentation) toward their latents
# stored at the end of their task, relative to the stored seeds' variance (less drift, offsets stay valid); 0: off
seed_distill_weight: 0.0
# auxiliary latent prediction on every task (algos/seed_drift_er.py LatentHead, not used for replay): weight of the
# loss predicting F(x) - F(s) for a partner x of each current-task sample s, 1..latent_pred_max_dt steps later in its
# demo, relative to the variance of F(x); 0: off
latent_pred_weight: 0.0
latent_pred_max_dt: 16
latent_pred_width: 512
# the target F(x) comes from an EMA copy of the obs encoder with this momentum per step (the online encoder as target
# collapsed the image latents)
latent_pred_target_momentum: 0.99
# VICReg variance term against the collapse (EMA target alone still shrank the latents): mean over image dims of
# relu(1 - batch std / latent_pred_std_floor), part of the latent prediction loss; 0: off
latent_pred_std_floor: 0.0
# control: drop the prediction term, keep only the variance term (same partner loading and encoder passes)
latent_pred_variance_only: false
# regression (LatentHead, partner's offset from the seed's 16-step chunk) | flow (FlowOffsetHead: conditional flow of the
# offset given F(s), proprio of s and x, the full action path between them and the signed steps)
latent_pred_head: regression
# partners also before the sample (backward in time)
latent_pred_signed: false
# flow head: action paths zero-padded / cut to this many steps
latent_pred_path_len: 48
# flow head, extra targets on old tasks: neighbouring raw seeds of a demo (encoded now) / offsets sampled from the head
# at the start of the task; both need seed_selection=temporal
latent_pred_seed_pairs: false
latent_pred_self_replay: false
# Euler steps when sampling offsets from the flow head (drift_compensation=pred_grad, self-replay)
latent_pred_sample_steps: 10
# re-encode the seeds and rebuild the replayed latents every refit_every training steps
refit_every: 200
# ridge strength toward the identity, relative to the mean eigenvalue of X^T X of the seeds
ridge_alpha: 1.0
