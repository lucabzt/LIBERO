# training
n_epochs: 50
batch_size: 32
num_workers: 4
grad_clip: 100.
loss_scale: 1.0

# resume training
resume: false
resume_path: ""
debug: false

use_augmentation: true

# best_success: keep the epoch with the highest success on the current task (LIBERO default,
# rollouts every eval.eval_every epochs); last_epoch: keep the final weights, no rollouts
# during training (the evaluation of all seen tasks after each task is unaffected)
checkpoint_selection: best_success
# false: keep only the checkpoint of the latest finished task (enough to resume)
keep_all_checkpoints: true

# evaluate and save an exponential moving average of the weights (diffusion_policy / UMI
# EMAModel), training continues from the raw weights; needs checkpoint_selection=last_epoch
ema:
  enabled: false
  power: 0.75
  max_value: 0.9999
  # false: one EMA carried over all tasks; true: a new EMA at the start of every task
  reset_per_task: false

defaults:
    - optimizer@optimizer: adam_w.yaml
    - scheduler@scheduler: cosine_annealing.yaml
