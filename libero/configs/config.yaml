# @package _global_

defaults:
  - _self_
  - data: default
  - policy: bc_transformer_policy
  - train: default
  - eval: default
  - lifelong: base
  - test: null

seed: 10000
use_wandb: false
wandb_project: "lifelong learning"
folder: null # use default path
bddl_folder: null # use default path
init_states_folder: null # use default path
output_dir: null # use default path (./experiments*)
load_previous_model: false
device: "cuda"
task_embedding_format: "bert"
# task_embedding_format=precomputed: {instruction: embedding} file (relative to libero/lifelong), e.g.
# task_embeddings/libero_goal_sentence-t5-base.pt
task_embedding_file: null
# subtract the mean embedding over the benchmark's task instructions (all tasks of the suite)
center_task_embs: false
task_embedding_one_hot_offset: 1
pretrain: false
pretrain_model_path: ""
# the first pretrain_n_tasks tasks of the order were learned by pretrain_model_path (Multitask with
# max_tasks=pretrain_n_tasks): they count as finished lifelong tasks (ER-style algorithms keep their
# data for replay), the lifelong stage starts at task pretrain_n_tasks
pretrain_n_tasks: 0
benchmark_name: "LIBERO_SPATIAL"
max_tasks: null # stop after this many lifelong tasks (null: all)
resume: false # continue the latest run under the same output path if unfinished (does nothing if finished)
